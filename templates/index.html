<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.12), transparent 35%),
                #f5f7fb;
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .page-wrapper {
            width: 100%;
            max-width: 620px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4f46e5, #2563eb);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 700;
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.25);
        }

        .header h1 {
            font-size: 30px;
            font-weight: 750;
            letter-spacing: -0.7px;
            margin-bottom: 7px;
        }

        .header p {
            color: #667085;
            font-size: 15px;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 22px;
            padding: 35px;
            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.08),
                0 3px 10px rgba(15, 23, 42, 0.03);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 650;
            color: #344054;
            margin-bottom: 9px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            pointer-events: none;
        }

        select {
            width: 100%;
            height: 52px;
            padding: 0 45px 0 45px;
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            background: #ffffff;
            color: #1d2939;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            appearance: auto;
        }

        select:hover {
            border-color: #98a2b3;
        }

        select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.10);
        }

        /* Status section */
        .status-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .status-option {
            position: relative;
        }

        .status-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .status-option label {
            height: 52px;
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            background: white;
            transition: all 0.2s ease;
            font-weight: 600;
            color: #475467;
        }

        .status-option label:hover {
            border-color: #98a2b3;
            transform: translateY(-1px);
        }

        .status-option input:checked + label {
            border-color: #4f46e5;
            background: #eef2ff;
            color: #3730a3;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
        }

        .absent-dot {
            background: #ef4444;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #4f46e5, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22);
            margin-top: 5px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.28);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            height: 1px;
            background: #eaecf0;
            margin: 27px 0 20px;
        }

        /* Back button */
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-decoration: none;
            color: #475467;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #4f46e5;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #98a2b3;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 20px 15px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 18px;
            }

            .header h1 {
                font-size: 26px;
            }

            .status-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <div class="header">
            <div class="logo">✓</div>

            <h1>Mark Attendance</h1>

            <p>Record student attendance quickly and easily</p>
        </div>


        <div class="card">

            <form method="POST">

                <!-- Student -->
                <div class="form-group">

                    <label for="student">
                        Select Student
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">👤</span>

                        <select name="student" id="student">

                            {% for student in students %}

                            <option value="{{ student.name }}">
                                {{ student.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- Status -->
                <div class="form-group">

                    <label>
                        Attendance Status
                    </label>

                    <div class="status-options">

                        <div class="status-option">

                            <input
                                type="radio"
                                name="status"
                                id="present"
                                value="Present"
                                checked
                            >

                            <label for="present">
                                <span class="status-dot"></span>
                                Present
                            </label>

                        </div>


                        <div class="status-option">

                            <input
                                type="radio"
                                name="status"
                                id="absent"
                                value="Absent"
                            >

                            <label for="absent">
                                <span class="status-dot absent-dot"></span>
                                Absent
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    Mark Attendance
                </button>

            </form>


            <div class="divider"></div>


            <a href="/" class="back-link">
                ← Back to Home
            </a>

        </div>


        <div class="footer">
            Attendance Management System
        </div>

    </div>

</body>

</html>
