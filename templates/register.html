<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Student</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(79, 70, 229, 0.13),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(37, 99, 235, 0.10),
                    transparent 32%
                ),
                #f6f8fc;

            color: #172033;
        }

        .page {
            width: 100%;
            max-width: 500px;
        }

        /* ================= HEADER ================= */

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 19px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #2563eb
            );

            color: white;
            font-size: 30px;
            font-weight: 700;

            box-shadow:
                0 12px 28px rgba(37, 99, 235, 0.24);
        }

        .header h1 {
            font-size: 30px;
            font-weight: 750;
            letter-spacing: -0.7px;
            margin-bottom: 8px;
            color: #101828;
        }

        .header p {
            color: #667085;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ================= CARD ================= */

        .card {
            background: rgba(255, 255, 255, 0.97);

            border: 1px solid #e5e7eb;
            border-radius: 22px;

            padding: 34px;

            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.08),
                0 3px 10px rgba(15, 23, 42, 0.03);
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 9px;

            font-size: 14px;
            font-weight: 650;

            color: #344054;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            pointer-events: none;
        }

        input {
            width: 100%;
            height: 53px;

            padding: 0 15px 0 45px;

            border: 1px solid #d0d5dd;
            border-radius: 12px;

            background: #ffffff;

            color: #101828;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        input::placeholder {
            color: #98a2b3;
        }

        input:hover {
            border-color: #98a2b3;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 4px rgba(79, 70, 229, 0.10);

            background: #ffffff;
        }

        /* ================= BUTTON ================= */

        .register-btn {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #2563eb
                );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 4px;

            box-shadow:
                0 10px 22px rgba(37, 99, 235, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 28px rgba(37, 99, 235, 0.28);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        /* ================= DIVIDER ================= */

        .divider {
            height: 1px;
            background: #eaecf0;

            margin: 26px 0 20px;
        }

        /* ================= BACK LINK ================= */

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            color: #475467;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #4f46e5;
        }

        /* ================= FOOTER ================= */

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #98a2b3;

            font-size: 12px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 520px) {

            body {
                padding: 20px 14px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 18px;
            }

            .header h1 {
                font-size: 26px;
            }

            .icon {
                width: 60px;
                height: 60px;
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

    <div class="page">


        <!-- Header -->

        <div class="header">

            <div class="icon">
                +
            </div>

            <h1>
                Register Student
            </h1>

            <p>
                Add a new student to the attendance management system
            </p>

        </div>


        <!-- Registration Card -->

        <div class="card">

            <form method="POST">


                <!-- Student Name -->

                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter student's full name"
                            required
                        >

                    </div>

                </div>


                <!-- Roll Number -->

                <div class="form-group">

                    <label for="roll_no">
                        Roll Number
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🎓
                        </span>

                        <input
                            type="text"
                            id="roll_no"
                            name="roll_no"
                            placeholder="Enter roll number"
                            required
                        >

                    </div>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Register Student
                </button>


            </form>


            <!-- Divider -->

            <div class="divider"></div>


            <!-- Back -->

            <a
                href="/"
                class="back-link"
            >
                ← Back to Home
            </a>

        </div>


        <div class="footer">
            Attendance Management System
        </div>


    </div>

</body>

</html>
